# Проект Xcode собирается из этого файла: cd ios && xcodegen generate
name: WhatToCook
options:
  bundleIdPrefix: ru.chtoprigotovit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WhatToCook:
    type: application
    platform: iOS
    sources:
      - WhatToCook
    info:
      path: WhatToCook/Info.plist
      properties:
        CFBundleDisplayName: Что приготовить
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Чтобы сфотографировать холодильник и узнать, что в нём есть.
        RecognizeHost: $(RECOGNIZE_HOST)
        RecognizeToken: $(RECOGNIZE_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    configFiles:
      Debug: App.xcconfig
      Release: App.xcconfig
    settings:
      base:
        # прежний идентификатор: с ним уже установленное приложение обновится, а не встанет второй копией
        PRODUCT_BUNDLE_IDENTIFIER: ru.chtoprigotovit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  WhatToCookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WhatToCookTests
    dependencies:
      - target: WhatToCook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WhatToCook.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WhatToCook
schemes:
  WhatToCook:
    build:
      targets:
        WhatToCook: all
    test:
      targets:
        - WhatToCookTests
