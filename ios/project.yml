# Проект Xcode собирается из этого файла: cd ios && xcodegen generate
name: ChtoPrigotovit
options:
  bundleIdPrefix: ru.chtoprigotovit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChtoPrigotovit:
    type: application
    platform: iOS
    sources:
      - ChtoPrigotovit
    info:
      path: ChtoPrigotovit/Info.plist
      properties:
        CFBundleDisplayName: Что приготовить
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.chtoprigotovit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ChtoPrigotovitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChtoPrigotovitTests
    dependencies:
      - target: ChtoPrigotovit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ChtoPrigotovit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChtoPrigotovit
schemes:
  ChtoPrigotovit:
    build:
      targets:
        ChtoPrigotovit: all
    test:
      targets:
        - ChtoPrigotovitTests
